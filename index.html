<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!-- 
    Política de Seguridad de Contenido (CSP):
    Permite scripts y estilos propios/Google Fonts, imágenes/multimedia externas,
    y conexiones a las APIs de RAWG (datos de juegos) y Google Translate.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://api.rawg.io https://translate.googleapis.com ws: wss:;" />
  
  <!-- Icono servido desde la raíz pública -->
  <link rel="icon" type="image/svg+xml" href="/SVG/Favicon/Favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Tipografías de Google Fonts e iconos de Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:ital,wght@0,700;0,900;1,700;1,900&display=swap"
    rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400&display=swap"
    rel="stylesheet">

  <title>GameBox</title>
</head>

<body>
  <!-- Contenedor raíz donde React monta la aplicación -->
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
